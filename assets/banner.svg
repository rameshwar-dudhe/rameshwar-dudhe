<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Rameshwar Dudhe — DevOps and Platform Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="55%"  stop-color="#121a24"/>
      <stop offset="100%" stop-color="#0a1520"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#326CE5"/>
      <stop offset="55%"  stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#326CE5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#326CE5" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#326CE5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8b98a8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <ellipse cx="960" cy="150" rx="300" ry="210" fill="url(#glow)"/>

  <!-- ── cluster topology motif ───────────────────────────────── -->
  <g transform="translate(880,60)" fill="none" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="1.5">
    <!-- control plane to workers -->
    <path d="M110,52 L40,140"/>
    <path d="M110,52 L110,140"/>
    <path d="M110,52 L180,140"/>
    <!-- worker mesh -->
    <path d="M40,140 L110,140" stroke-opacity="0.28"/>
    <path d="M110,140 L180,140" stroke-opacity="0.28"/>
    <path d="M40,140 L110,196 L180,140" stroke-opacity="0.28"/>
  </g>

  <!-- control plane node -->
  <g transform="translate(880,60)">
    <rect x="82" y="26" width="56" height="52" rx="7" fill="#0d1117" stroke="#326CE5" stroke-width="2"/>
    <path d="M110,40 l14,8 v16 l-14,8 -14,-8 v-16 z" fill="none" stroke="#326CE5" stroke-width="1.8"/>
    <circle cx="110" cy="52" r="3.4" fill="#326CE5"/>
  </g>

  <!-- worker nodes -->
  <g transform="translate(880,60)" fill="#0d1117" stroke="#2dd4bf" stroke-width="1.8">
    <rect x="16"  y="118" width="48" height="44" rx="6"/>
    <rect x="86"  y="118" width="48" height="44" rx="6"/>
    <rect x="156" y="118" width="48" height="44" rx="6"/>
    <rect x="86"  y="174" width="48" height="44" rx="6"/>
  </g>
  <g transform="translate(880,60)" fill="#2dd4bf" fill-opacity="0.85">
    <rect x="26"  y="130" width="28" height="4" rx="2"/><rect x="26"  y="140" width="18" height="4" rx="2"/>
    <rect x="96"  y="130" width="28" height="4" rx="2"/><rect x="96"  y="140" width="18" height="4" rx="2"/>
    <rect x="166" y="130" width="28" height="4" rx="2"/><rect x="166" y="140" width="18" height="4" rx="2"/>
    <rect x="96"  y="186" width="28" height="4" rx="2"/><rect x="96"  y="196" width="18" height="4" rx="2"/>
  </g>

  <!-- ── type ─────────────────────────────────────────────────── -->
  <text x="80" y="112"
        font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="58" font-weight="700" fill="#e6edf3" letter-spacing="-0.5">Rameshwar Dudhe</text>

  <rect x="80" y="134" width="420" height="3" rx="1.5" fill="url(#rule)"/>

  <text x="80" y="180"
        font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="25" font-weight="600" fill="#2dd4bf">DevOps &amp; Platform Engineer</text>

  <text x="80" y="216"
        font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="17" fill="#8b98a8">Kubernetes platforms built end to end &#8212; provisioned, deployed and observed as code.</text>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace"
     font-size="13.5" fill="#7d8998" letter-spacing="1.4">
    <text x="80" y="262">KUBERNETES</text>
    <text x="204" y="262">TERRAFORM</text>
    <text x="322" y="262">ANSIBLE</text>
    <text x="418" y="262">HELM</text>
    <text x="486" y="262">ARGO CD</text>
    <text x="576" y="262">PROMETHEUS</text>
    <text x="700" y="262">ISTIO</text>
  </g>
  <g fill="#326CE5">
    <circle cx="194" cy="257" r="2"/><circle cx="312" cy="257" r="2"/>
    <circle cx="408" cy="257" r="2"/><circle cx="476" cy="257" r="2"/>
    <circle cx="566" cy="257" r="2"/><circle cx="690" cy="257" r="2"/>
  </g>

  <rect x="0" y="316" width="1200" height="4" fill="url(#rule)"/>
</svg>
